map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # Compose can replace a container without restarting nginx, which changes
    # the service IP. Resolve through Docker DNS instead of pinning that IP at
    # nginx startup, or the web app starts returning 502 after an API rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hookary_api http://api:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Google Sign-In popups need to retain their opener when FedCM is not in
    # use. nosniff also makes the browser enforce the WASM/JS content types.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    # The browser talks to its own origin. nginx resolves the Compose-only
    # service name and keeps HttpOnly refresh cookies first-party.
    location /v1/ {
        proxy_pass $hookary_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 65s;
    }

    location /health/ {
        proxy_pass $hookary_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Flutter uses client-side routing; unknown paths must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
