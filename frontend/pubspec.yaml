name: hookary
description: "Hookary — turns a long video into short vertical clips."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  intl: ^0.20.3
  url_launcher: ^6.3.2
  video_player: ^2.13.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
