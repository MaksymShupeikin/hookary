version: "2"

# Generated code is committed, so sqlc runs rarely: `make sqlc`. It runs in
# Docker rather than as a Go tool dependency, to keep its build graph out of
# the service images.
sql:
  - engine: postgresql
    schema: migrations
    queries: db/queries
    gen:
      go:
        package: db
        out: db
        sql_package: pgx/v5
        emit_prepared_queries: false
        emit_interface: false
        emit_empty_slices: true
        # Nullable columns become *T rather than pgtype wrappers, so a value
        # that can be absent is absent in the type system too.
        emit_pointers_for_null_types: true
        overrides:
          # The ulid domain is a text domain; without this sqlc emits an
          # interface{} for every id.
          - db_type: "ulid"
            go_type: "string"
          - db_type: "ulid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
